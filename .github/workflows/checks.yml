name: Aegis checks

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - "aegis_rules.txt"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "aegis_rules.txt"
      - ".github/workflows/checks.yml"

permissions:
  contents: read

jobs:
  checks:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      SEND_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check required files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = (
              "firestore_worker.py",
              "firestore_http.py",
              "aegis_rules.txt",
          )

          missing = [
              name
              for name in required
              if not Path(name).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing required files: " + ", ".join(missing)
              )

          if not Path("aegis_rules.txt").read_text(
              encoding="utf-8"
          ).strip():
              raise SystemExit("aegis_rules.txt is empty")
          PY

      - name: Compile Python files
        run: |
          python -m py_compile \
            firestore_worker.py \
            firestore_http.py \
            test_firestore_worker.py

      - name: Run tests
        run: python -m unittest discover -v
