name: Aegis run

on:
  schedule:
    - cron: "30 6 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Maximum bot session length"
        required: true
        default: "240"
        type: choice
        options:
          - "240"
          - "300"
          - "350"

      send_enabled:
        description: "Send public replies (unchecked = dry run)"
        required: true
        default: false
        type: boolean
      send_enabled:
        description: "Send public replies (unchecked = dry run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aegis-chat-session
  cancel-in-progress: false

jobs:
  run-aegis:
    name: Aegis chat session
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check required files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = (
              "firestore_worker.py",
              "firestore_http.py",
              "aegis_rules.txt",
          )

          missing = [
              name
              for name in required
              if not Path(name).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing required files: " + ", ".join(missing)
              )

          if not Path("aegis_rules.txt").read_text(
              encoding="utf-8"
          ).strip():
              raise SystemExit("aegis_rules.txt is empty")
          PY

      - name: Compile Python files
        run: |
          python -m py_compile \
            firestore_worker.py \
            firestore_http.py \
            test_firestore_worker.py

      - name: Run tests
        run: python -m unittest discover -v

      - name: Validate credentials
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os

          required = (
              "FIREBASE_API_KEY",
              "SITE_USERNAME",
              "SITE_PASSWORD",
              "GROQ_API_KEY",
          )

          missing = [
              name
              for name in required
              if not os.getenv(name)
          ]

          if missing:
              raise SystemExit(
                  "Missing repository secrets: "
                  + ", ".join(missing)
              )
          PY

      - name: Run Aegis
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          SEND_ENABLED: ${{ github.event_name == 'schedule' && 'true' || (inputs.send_enabled && 'true' || 'false') }}
          RUN_MINUTES: ${{ inputs.duration_minutes || '240' }}

          GROQ_MODEL: "openai/gpt-oss-120b"
          CONTROL_PROJECT: "database-2-a5b32"

          POLL_SECONDS: "8"
          SLOW_FLOOR: "15"
          QUOTA_COOLDOWN_SECONDS: "300"

        shell: bash
        run: |
          case "$RUN_MINUTES" in
            240|300|350) ;;
            *)
              echo "Invalid session duration."
              exit 1
              ;;
          esac

          {
            echo "## Aegis session"
            echo
            echo "- Maximum session: ${RUN_MINUTES} minutes"
            echo "- Public replies enabled: ${SEND_ENABLED}"
            echo "- No automatic restart"
          } >> "$GITHUB_STEP_SUMMARY"

          set +e

          timeout \
            --signal=TERM \
            --kill-after=30s \
            "${RUN_MINUTES}m" \
            python -u firestore_worker.py

          result=$?
          set -e

          if [ "$result" -eq 124 ]; then
            echo "Aegis reached its configured session limit."
            echo "- Session reached its configured time limit." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$result" -eq 0 ]; then
            echo "Aegis stopped normally."
            exit 0
          fi

          echo "Aegis exited with status ${result}."
          exit "$result"
